name: FinSecure RAG Evaluation CI/CD Gatekeeper

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  rag-regression-gate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ingest Knowledge Base
      run: |
        python -m src.ingestion
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    - name: Execute Candidate Evaluation Suite
      run: |
        python -m evals.run_suite --output candidate_run.json
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    - name: Run CI/CD Regression Engine (Enforce Zero Regressions)
      run: |
        python -m evals.compare --baseline baselines/baseline.json --candidate candidate_run.json --report regression_report.md
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    - name: Upload Regression Markdown Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: rag-regression-report
        path: regression_report.md
